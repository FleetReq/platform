name: Cleanup Expired Accounts

on:
  # Scheduled runs moved to Vercel Cron (vercel.json) — GitHub disables
  # schedules after 60 days without commits. Kept for manual runs only.
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup expired accounts
        run: |
          curl -f -L -X POST https://fleetreq.vercel.app/api/cron/cleanup-expired-accounts/ \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || exit 1

      - name: Log success
        if: success()
        run: echo "Account cleanup completed successfully at $(date)"

      - name: Log failure
        if: failure()
        run: echo "Account cleanup failed at $(date)"
