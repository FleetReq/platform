name: Execute Pending Downgrades

on:
  # Scheduled runs moved to Vercel Cron (vercel.json) — GitHub disables
  # schedules after 60 days without commits. Kept for manual runs only.
  workflow_dispatch:

jobs:
  execute-downgrades:
    runs-on: ubuntu-latest
    steps:
      - name: Execute pending downgrades
        run: |
          curl -f -L -X POST https://fleetreq.vercel.app/api/cron/execute-pending-downgrades/ \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || exit 1

      - name: Log success
        if: success()
        run: echo "Pending downgrades executed successfully at $(date)"

      - name: Log failure
        if: failure()
        run: echo "Downgrade execution failed at $(date)"
